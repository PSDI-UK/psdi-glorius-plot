{% extends "parent/layout.htm" %}

{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{url_for('static', filename='css/index.css')}}">
<script type="module" src="{{url_for('static', filename='js/index.js')}}"></script>
{% endblock %}

{% block hero_title %}PSDI Glorius Plot Generator{% endblock %}

{% block inner_content %}
<div id="plot-options">
  <p>
    <label for="min-output-input">Minimum output: </label>
    <input type="number" step="any" value="-100" name="min-output-input" id="min-output-input"
      class="trigger-chart-update">
    <label for="max-output-input"> Maximum output: </label>
    <input type="number" step="any" value="50" name="max-output-input" id="max-output-input"
      class="trigger-chart-update">
    <label for="band-width-input"> Band width: </label>
    <input type="number" step="any" value="25" name="band-width-input" id="band-width-input"
      class="trigger-chart-update">
  </p>
  <p>
    <input type="checkbox" name="grid-line-toggle" id="grid-line-toggle" class="trigger-chart-update" checked>
    <label for="grid-line-toggle"> Show grid lines</label>
    <input type="checkbox" name="axis-line-toggle" id="axis-line-toggle" class="trigger-chart-update" checked>
    <label for="axis-line-toggle"> Show axis lines</label>
  </p>
  <p>
    <label for="min-color-input">Color at lowest output: </label>
    <input type="color" value="#FF8080" name="min-color-input" id="min-color-input" class="trigger-chart-update">
    <label for="max-color-input"> Color at highest output: </label>
    <input type="color" value="#20A020" name="max-color-input" id="max-color-input" class="trigger-chart-update">
  </p>
  <p>
    <label for="sort-option">Data arrangement: </label>
    <select name="sort-option" id="sort-option" class="trigger-chart-update">
      <option value="1">Ascending</option>
      <option value="-1">Descending</option>
      <option value="0">As entered</option>
    </select>
  </p>
  <p>
    <input type="checkbox" name="input-mode-toggle" id="input-mode-toggle">
    <label for="input-mode-toggle"> Directly input deviations</label>
  </p>
  <p>
    <label for="num-conditions">Test conditions: </label>
    <select name="num-conditions" id="num-conditions">
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
      <option value="11">11</option>
      <option value="12">12</option>
    </select>
    <label for="num-outputs"> Output parameters: </label>
    <select name="num-outputs" id="num-outputs">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>
  </p>
</div>
<form class="sens-form">

  <table class="output-label-table">
    <tr class="output-label-row">
      <td class="output-label-button-cell">
        <button type="button" id="remove-ob-0" class="remove-output disabled fix-size-small" disabled="true">-</button>
        <button type="button" id="add-ob-0" class="add-output fix-size-small">+</button>
      </td>
      <td class="output-label-label-cell">
        <label for="ol-0" class="output-label-label">Output 1 Label:</label>
      </td>
      <td class="output-label-value-cell">
        <input type="text" id="ol-0" class="output-label-input trigger-chart-update" placeholder="Output (e.g. “Yield”)"
          value="Yield">
      </td>
    </tr>
  </table>

  <br>

  <table class="sensitivity-table">

    <tr class="sensitivity-header">

      <th class="empty-heading"></th>

      <th class="condition-label-heading">
        Label
      </th>

      <th class="value-heading calc-mode-only" id="vh-0">Value</th>

      <th class="deviation-heading">
        <span class="mouseover calc-mode-only" data-bs-toggle="tooltip" data-bs-custom-class="tooltip-on-light"
          data-bs-placement="top" title="Deviation is calculated as (Result - Baseline)/Baseline * 100%">
          Deviation (%)</span>
        <span class="mouseover direct-mode-only" data-bs-toggle="tooltip" data-bs-custom-class="tooltip-on-light"
          data-bs-placement="top"
          title="Enter the deviation from the baseline as a percentage, i.e. (Result - Baseline)/Baseline * 100%">
          Deviation (%)</span>
      </th>

    </tr>

    <tr class="baseline-row calc-mode-only">
      <td class="empty-cell"></td>
      <td class="baseline-label calc-mode-only">Baseline</td>
      <td class="baseline-value-cell calc-mode-only">
        <div class="baseline-line-container">
          <div class="baseline-input-line">
            <input type="number" step="any" class="baseline-value trigger-chart-update">
          </div>
        </div>
      </td>
      <td class="empty-cell"></td>
    </tr>

    <tr class="condition-row">
      <td class="condition-button-cell">
        <button type="button" id="remove-rb-0" class="remove-condition disabled fix-size-small"
          disabled="true">-</button>
        <button type="button" id="add-rb-0" class="add-condition fix-size-small">+</button>
      </td>
      <td class="condition-label-cell">
        <input type="text" class="condition-label trigger-chart-update" placeholder="Condition (e.g. “High c”)">
      </td>
      <td class="sample-value-cell calc-mode-only">
        <div class="sample-line-container">
          <div class="sample-input-line">
            <input type="number" step="any" class="sample-value trigger-deviation-update">
          </div>
        </div>
      </td>
      <td class="deviation-value-cell">
        <div class="deviation-line-container">
          <div class="deviation-input-line">
            <input type="number" step="any" class="calc-mode-disabled deviation-value trigger-chart-update" value="0"
              disabled>
            <span>%</span>
          </div>
        </div>
      </td>
    </tr>

    <tr class="condition-row">
      <td class="condition-button-cell">
        <button type="button" id="remove-rb-1" class="remove-condition disabled fix-size-small"
          disabled="true">-</button>
        <button type="button" id="add-rb-1" class="add-condition fix-size-small">+</button>
      </td>
      <td class="condition-label-cell">
        <input type="text" class="condition-label trigger-chart-update" placeholder="Condition (e.g. “High c”)">
      </td>
      <td class="sample-value-cell calc-mode-only">
        <div class="sample-line-container">
          <div class="sample-input-line">
            <input type="number" step="any" class="sample-value trigger-deviation-update">
          </div>
        </div>
      </td>
      <td class="deviation-value-cell">
        <div class="deviation-line-container">
          <div class="deviation-input-line">
            <input type="number" step="any" class="calc-mode-disabled deviation-value trigger-chart-update" value="0"
              disabled>
            <span>%</span>
          </div>
        </div>
      </td>
    </tr>

    <tr class="condition-row">
      <td class="condition-button-cell">
        <button type="button" id="remove-rb-2" class="remove-condition disabled fix-size-small"
          disabled="true">-</button>
        <button type="button" id="add-rb-2" class="add-condition fix-size-small">+</button>
      </td>
      <td class="condition-label-cell">
        <input type="text" class="condition-label trigger-chart-update" placeholder="Condition (e.g. “High c”)">
      </td>
      <td class="sample-value-cell calc-mode-only">
        <div class="sample-line-container">
          <div class="sample-input-line">
            <input type="number" step="any" class="sample-value trigger-deviation-update">
          </div>
        </div>
      </td>
      <td class="deviation-value-cell">
        <div class="deviation-line-container">
          <div class="deviation-input-line">
            <input type="number" step="any" class="calc-mode-disabled deviation-value trigger-chart-update" value="0"
              disabled>
            <span>%</span>
          </div>
        </div>
      </td>
    </tr>

  </table>

  <button type="button" id="generate-plot">Generate</button>
  <span id="auto-update">
    <input type="checkbox" name="auto-update-toggle" id="auto-update-toggle" checked>
    <label for="auto-update-toggle"> Auto-update</label>
  </span>
  <br>
  <button type="button" id="fill-random">Fill with random data</button>
</form>

<canvas id="glorius-plot" class="white-bg"></canvas>
{% endblock %}
