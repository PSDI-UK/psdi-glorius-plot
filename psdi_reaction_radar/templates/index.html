{% extends "parent/layout.htm" %}

{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{url_for('static', filename='css/index.css')}}">
<script type="module" src="{{url_for('static', filename='js/index.js')}}"></script>
{% endblock %}

{% block hero_title %}PSDI Glorius Plot Generator{% endblock %}

{% block inner_content %}
<table id="table-options">
  <tr>
    <td>
      <label for="num-condition">Test conditions: </label>
    </td>
    <td>
      <select name="num-condition" id="num-condition">
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5" selected>5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
      </select>
    </td>
    <td id="num-sample-cell">
      <label for="num-sample" class="calc-mode-only">Number of experiments conducted for each test condition:</label>
    </td>
    <td>
      <select name="num-sample" id="num-sample" class="calc-mode-only">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select>
    </td>
  </tr>
  <tr class="hidden">
    <td>
      <label for="num-output">Reaction outcomes: </label>
    </td>
    <td>
      <select name="num-output" id="num-output">
        <option value="1">1</option>
        <option value="2">2</option>
      </select>
    </td>
    <td>
      <label for="input-mode-toggle">Directly input deviations: </label>
    </td>
    <td>
      <input type="checkbox" name="input-mode-toggle" id="input-mode-toggle">
    </td>
  </tr>
</table>

<form class="sens-form">

  <table class="output-label-table">
    <tr class="output-label-row">
      <td class="output-button-cell hidden">
        <button type="button" id="remove-ob-0" class="remove-output disabled fix-size-small" disabled="true">-</button>
        <button type="button" id="add-ob-0" class="add-output fix-size-small">+</button>
      </td>
      <td class="output-label-cell">
        <label for="os-0" class="output-label">Outcome:</label>
      </td>
      <td class="output-label-select-cell">
        <select name="output-label-select" class="output-label-select trigger-chart-update" id="os-0">
          <option value="Isolated Yield (%)" selected>Isolated Yield (%)</option>Chromatographic Yield (%)
          <option value="Spectroscopic Yield (%)">Spectroscopic Yield (%)</option>
          <option value="Chromatographic Yield (%)">Chromatographic Yield (%)</option>
          <option value="ee (%)">ee (%)</option>
          <option value="de (%)">de (%)</option>
          <option value="Other">Other</option>
        </select>
      </td>
      <td class="output-label-value-cell hidden">
        <input type="text" id="ol-0" class="output-input trigger-chart-update" placeholder="Define outcome"
          value="Isolated Yield (%)">
      </td>
    </tr>
  </table>

  <br>

  <table class="sensitivity-table">

    <tr class="sensitivity-buttons calc-mode-only">

      <td class="empty-cell"></td>
      <td class="empty-cell"></td>
      <td class="sample-button-cell">
        <button type="button" id="remove-sb-0" class="remove-sample disabled fix-size-small" disabled="true">-</button>
        <button type="button" id="add-sb-0" class="add-sample fix-size-small">+</button>
      </td>
      <td class="empty-cell button-mean-cell hidden"></td>
      <td class="empty-cell button-abs-deviation-cell"></td>
      <td class="empty-cell button-rel-deviation-cell"></td>

    </tr>

    <tr class="sensitivity-header">

      <th class="empty-heading"></th>

      <th class="condition-label-heading">
        Label
      </th>

      <th class="sample-heading calc-mode-only">Isolated Yield (%)</th>

      <th class="mean-heading hidden">Mean</th>

      <th class="abs-deviation-heading">Deviation (+/-)</th>

      <th class="rel-deviation-heading">Deviation (%)</th>

    </tr>

    <tr class="baseline-row calc-mode-only">
      <td class="empty-cell"></td>
      <td class="baseline-label calc-mode-only">Standard Conditions</td>
      <td class="baseline-value-cell calc-mode-only">
        <div class="baseline-line-container">
          <div class="baseline-input-line">
            <input type="number" min="0" max="100" step="any" class="baseline-value trigger-chart-update">
          </div>
        </div>
      </td>
      <td class="baseline-mean-cell hidden">
        <input type="number" step="any" class="calc-mode-disabled mean-value trigger-chart-update" value="100" disabled>
      </td>
      <td class="empty-cell baseline-abs-deviation-cell"></td>
      <td class="empty-cell baseline-rel-deviation-cell"></td>
    </tr>

    <tr class="condition-row">
      <td class="condition-button-cell">
        <button type="button" id="remove-rb-0" class="remove-condition disabled fix-size-small"
          disabled="true">-</button>
        <button type="button" id="add-rb-0" class="add-condition fix-size-small">+</button>
      </td>
      <td class="condition-label-cell">
        <input type="text" class="condition-label trigger-chart-update" placeholder="Condition (e.g. “High c”)">
      </td>
      <td class="sample-value-cell calc-mode-only">
        <div class="sample-line-container">
          <div class="sample-input-line">
            <input type="number" min="0" max="100" step="any" class="sample-value trigger-deviation-update">
          </div>
        </div>
      </td>
      <td class="mean-value-cell hidden">
        <div class="mean-line-container">
          <div class="mean-input-line">
            <input type="number" step="any" class="mean-value trigger-chart-update" value="0" disabled>
          </div>
        </div>
      </td>
      <td class="abs-deviation-value-cell">
        <div class="abs-deviation-line-container">
          <div class="abs-deviation-input-line">
            <input type="number" step="any" class="abs-deviation-value trigger-chart-update" value="0" disabled>
          </div>
        </div>
      </td>
      <td class="rel-deviation-value-cell">
        <div class="rel-deviation-line-container">
          <div class="rel-deviation-input-line">
            <input type="number" step="any" class="rel-deviation-value trigger-chart-update" value="0" disabled>
          </div>
        </div>
      </td>
    </tr>

    <tr class="condition-row">
      <td class="condition-button-cell">
        <button type="button" id="remove-rb-1" class="remove-condition disabled fix-size-small"
          disabled="true">-</button>
        <button type="button" id="add-rb-1" class="add-condition fix-size-small">+</button>
      </td>
      <td class="condition-label-cell">
        <input type="text" class="condition-label trigger-chart-update" placeholder="Condition (e.g. “High c”)">
      </td>
      <td class="sample-value-cell calc-mode-only">
        <div class="sample-line-container">
          <div class="sample-input-line">
            <input type="number" min="0" max="100" step="any" class="sample-value trigger-deviation-update">
          </div>
        </div>
      </td>
      <td class="mean-value-cell hidden">
        <div class="mean-line-container">
          <div class="mean-input-line">
            <input type="number" step="any" class="mean-value trigger-chart-update" value="0" disabled>
          </div>
        </div>
      </td>
      <td class="abs-deviation-value-cell">
        <div class="abs-deviation-line-container">
          <div class="abs-deviation-input-line">
            <input type="number" step="any" class="abs-deviation-value trigger-chart-update" value="0" disabled>
          </div>
        </div>
      </td>
      <td class="rel-deviation-value-cell">
        <div class="rel-deviation-line-container">
          <div class="rel-deviation-input-line">
            <input type="number" step="any" class="rel-deviation-value trigger-chart-update" value="0" disabled>
          </div>
        </div>
      </td>
    </tr>

    <tr class="condition-row">
      <td class="condition-button-cell">
        <button type="button" id="remove-rb-2" class="remove-condition disabled fix-size-small"
          disabled="true">-</button>
        <button type="button" id="add-rb-2" class="add-condition fix-size-small">+</button>
      </td>
      <td class="condition-label-cell">
        <input type="text" class="condition-label trigger-chart-update" placeholder="Condition (e.g. “High c”)">
      </td>
      <td class="sample-value-cell calc-mode-only">
        <div class="sample-line-container">
          <div class="sample-input-line">
            <input type="number" min="0" max="100" step="any" class="sample-value trigger-deviation-update">
          </div>
        </div>
      </td>
      <td class="mean-value-cell hidden">
        <div class="mean-line-container">
          <div class="mean-input-line">
            <input type="number" step="any" class="mean-value trigger-chart-update" value="0" disabled>
          </div>
        </div>
      </td>
      <td class="abs-deviation-value-cell">
        <div class="abs-deviation-line-container">
          <div class="abs-deviation-input-line">
            <input type="number" step="any" class="abs-deviation-value trigger-chart-update" value="0" disabled>
          </div>
        </div>
      </td>
      <td class="rel-deviation-value-cell">
        <div class="rel-deviation-line-container">
          <div class="rel-deviation-input-line">
            <input type="number" step="any" class="rel-deviation-value trigger-chart-update" value="0" disabled>
          </div>
        </div>
      </td>
    </tr>

    <tr class="condition-row">
      <td class="condition-button-cell">
        <button type="button" id="remove-rb-3" class="remove-condition disabled fix-size-small"
          disabled="true">-</button>
        <button type="button" id="add-rb-3" class="add-condition fix-size-small">+</button>
      </td>
      <td class="condition-label-cell">
        <input type="text" class="condition-label trigger-chart-update" placeholder="Condition (e.g. “High c”)">
      </td>
      <td class="sample-value-cell calc-mode-only">
        <div class="sample-line-container">
          <div class="sample-input-line">
            <input type="number" min="0" max="100" step="any" class="sample-value trigger-deviation-update">
          </div>
        </div>
      </td>
      <td class="mean-value-cell hidden">
        <div class="mean-line-container">
          <div class="mean-input-line">
            <input type="number" step="any" class="mean-value trigger-chart-update" value="0" disabled>
          </div>
        </div>
      </td>
      <td class="abs-deviation-value-cell">
        <div class="abs-deviation-line-container">
          <div class="abs-deviation-input-line">
            <input type="number" step="any" class="abs-deviation-value trigger-chart-update" value="0" disabled>
          </div>
        </div>
      </td>
      <td class="rel-deviation-value-cell">
        <div class="rel-deviation-line-container">
          <div class="rel-deviation-input-line">
            <input type="number" step="any" class="rel-deviation-value trigger-chart-update" value="0" disabled>
          </div>
        </div>
      </td>
    </tr>

    <tr class="condition-row">
      <td class="condition-button-cell">
        <button type="button" id="remove-rb-4" class="remove-condition disabled fix-size-small"
          disabled="true">-</button>
        <button type="button" id="add-rb-4" class="add-condition fix-size-small">+</button>
      </td>
      <td class="condition-label-cell">
        <input type="text" class="condition-label trigger-chart-update" placeholder="Condition (e.g. “High c”)">
      </td>
      <td class="sample-value-cell calc-mode-only">
        <div class="sample-line-container">
          <div class="sample-input-line">
            <input type="number" min="0" max="100" step="any" class="sample-value trigger-deviation-update">
          </div>
        </div>
      </td>
      <td class="mean-value-cell hidden">
        <div class="mean-line-container">
          <div class="mean-input-line">
            <input type="number" step="any" class="mean-value trigger-chart-update" value="0" disabled>
          </div>
        </div>
      </td>
      <td class="abs-deviation-value-cell">
        <div class="abs-deviation-line-container">
          <div class="abs-deviation-input-line">
            <input type="number" step="any" class="abs-deviation-value trigger-chart-update" value="0" disabled>
          </div>
        </div>
      </td>
      <td class="rel-deviation-value-cell">
        <div class="rel-deviation-line-container">
          <div class="rel-deviation-input-line">
            <input type="number" step="any" class="rel-deviation-value trigger-chart-update" value="0" disabled>
          </div>
        </div>
      </td>
    </tr>

  </table>

  <button type="button" id="generate-plot">Generate</button>
  <span id="auto-update">
    <input type="checkbox" name="auto-update-toggle" id="auto-update-toggle" checked>
    <label for="auto-update-toggle"> Auto-update</label>
  </span>
  <br>
  <button type="button" id="fill-random">Fill with random data</button>
  <button type="button" id="fill-example" class="mouseover-tooltip" data-bs-toggle="tooltip"
    data-bs-custom-class="tooltip-on-light" data-bs-placement="top" title="This fills the table with an example 
    dataset sourced from Zhang 𝘦𝘵 𝘢𝘭. (2024), “Solvent-Dependent Divergent Cyclization of Bicyclo[1.1.0]butanes”, Table 
    S9">Fill with example data</button>
</form>

<canvas id="glorius-plot" class="white-bg"></canvas>

<div id="export-buttons">
  <button type="button" id="export-image-png">Download Plot as PNG</button>
</div>

<br>

<div id="plot-options">
  <p>
    <label for="dev-plot-select" data-bs-toggle="tooltip" data-bs-custom-class="tooltip-on-light"
      data-bs-placement="top" title="“<b>Mean</b>” will result in outcomes being displayed directly on the plot, alongside a
                                     line for the standard conditions.<br><br>
                                     “<b>Deviation (+/-)</b>” will plot the difference of
                                     the (mean) outcome from the standard conditions.<br><br>
                                     “<b>Deviation (%)</b>” will plot this
                                     value divided by the standard conditions, expressed as a per cent."
      class="mouseover-tooltip" data-bs-html="true">Value to plot: </label>
    <select name="dev-plot-select" id="dev-plot-select" class="trigger-chart-update">
      <option value="mean">Mean</option>
      <option value="absolute">Deviation (+/-)</option>
      <option value="relative" selected>Deviation (%)</option>
    </select>
  </p>
  <p>
    <label for="width-input">Plot width in pixels: </label>
    <input type="number" step="50" value="800" min="200" max="4000" name="width-input" id="width-input"
      class="trigger-chart-update">
    <label for="height-input">Plot height in pixels: </label>
    <input type="number" step="50" value="600" min="200" max="4000" name="height-input" id="height-input"
      class="trigger-chart-update">
    <label for="font-size-input">Label font size: </label>
    <input type="number" name="font-size-input" id="font-size-input" class="trigger-chart-update" min="2" max="64"
      value="18">
    <br>
    <input type="checkbox" name="lock-aspect-ratio" id="lock-aspect-ratio" checked>
    <label for="lock-aspect-ratio"> Lock aspect ratio</label>
    <input type="checkbox" name="scale-font-size" id="scale-font-size">
    <label for="scale-font-size"> Scale font size with plot size</label>
    <br>
    <button type="button" id="reset-plot-dims" class="trigger-chart-update">Reset Size and Shape</button>
  </p>
  <p>
    <label for="min-output-input" class="non-none-dev-mode-only">Minimum output: </label>
    <input type="number" step="any" value="-100" name="min-output-input" id="min-output-input"
      class="trigger-chart-update non-none-dev-mode-only">
    <label for="max-output-input" class="non-none-dev-mode-only"> Maximum output: </label>
    <input type="number" step="any" value="50" name="max-output-input" id="max-output-input"
      class="trigger-chart-update non-none-dev-mode-only">
    <label for="band-width-input"> Band width: </label>
    <input type="number" step="any" value="25" name="band-width-input" id="band-width-input"
      class="trigger-chart-update">
  </p>
  <p>
    <input type="checkbox" name="fan-toggle" id="fan-toggle" class="trigger-chart-update">
    <label for="fan-toggle"> Display as fan plot instead of radar</label>
  </p>
  <p class="fan-mode-only hidden">
    <label for="fan-tip-size">Tip size of bars: </label>
    <input type="number" name="fan-tip-size" id="fan-tip-size" class="trigger-chart-update" value="3" min="0" step="1">
    <label for="fan-bar-separation">Base separation of bars: </label>
    <input type="number" name="fan-bar-separation" id="fan-bar-separation" class="trigger-chart-update" value="3"
      min="0" step="1">
  </p>
  <p class="radar-mode-only">
    <input type="checkbox" name="grid-line-toggle" id="grid-line-toggle" class="trigger-chart-update" checked>
    <label for="grid-line-toggle"> Show grid lines</label>
    <input type="checkbox" name="axis-line-toggle" id="axis-line-toggle" class="trigger-chart-update" checked>
    <label for="axis-line-toggle"> Show axis lines</label>
  </p>
  <p>
    <label for="color-select">Colour scheme: </label>
    <select name="color-select" id="color-select">
      <option value="classic" selected>Classic</option>
      <option value="colourblind">Colourblind-friendly</option>
      <option value="greyscale">Greyscale</option>
      <option value="custom">Custom</option>
    </select>
  </p>
  <p class="color-custom hidden">
    <label for="min-color-input">Color at lowest output: </label>
    <input type="color" value="#FF8080" name="min-color-input" id="min-color-input" class="trigger-chart-update">
    <label for="max-color-input"> Color at highest output: </label>
    <input type="color" value="#20A020" name="max-color-input" id="max-color-input" class="trigger-chart-update">
  </p>
  <p>
    <label for="sort-option">Data arrangement: </label>
    <select name="sort-option" id="sort-option" class="trigger-chart-update">
      <option value="1">Ascending</option>
      <option value="-1">Descending</option>
      <option value="0">As entered</option>
    </select>
  </p>
</div>
{% endblock %}
