# Workflow for continuous integration tasks run periodically

name: CI - Periodic jobs
run-name: CI - Periodic jobs

on:
  workflow_dispatch:
  schedule:
    # Run every Sunday-Monday midnight
    - cron: "00 0 * * mon"

jobs:
  update-assets:
    uses: PSDI-UK/psdi-github-workflows-public/.github/workflows/update-common-assets.yml@6077506c3723a31fad3b6ff02c84c16f2a8ffc6c
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
